AWSTemplateFormatVersion: '2010-09-09'

# ==============================================================================
#  SOURCE OF TRUTH: scripts/setup-db.mjs
# ==============================================================================
#  This template is a *mirror* of the table shapes that scripts/setup-db.mjs
#  provisions, kept so the same tables can be created via CloudFormation in a
#  fresh account. setup-db.mjs is authoritative: if the two ever disagree, this
#  file is the one that is wrong.
#
#  It previously disagreed on every single key, which meant a stack-created
#  environment and a script-created environment produced tables the application
#  code could not both read:
#
#    | entity        | this template (before) | setup-db.mjs / app code (now) |
#    |---------------|------------------------|-------------------------------|
#    | Organizations | PK organizationId      | PK id                         |
#    | Licenses      | PK licenseId           | PK id                         |
#    | Licenses GSI  | OrganizationIdIndex    | byOrgId                       |
#    | Licenses GSI  | UserIdIndex            | byUserId                      |
#    | Licenses attr | organizationId         | orgId                         |
#    | Org Units     | (absent)               | PK id, byOrgId / byParentId   |
#    | Roles         | PK roleId              | PK id                         |
#    | PagePerms     | PK permissionId        | PK id (id === path)           |
#
#  The right-hand column is what lib/organizationService.ts, lib/licenseService.ts,
#  lib/orgUnitService.ts, lib/rolesService.ts and lib/pagePermissionsService.ts
#  actually issue their Get/Query/Put calls against.
#
#  When you add a table or GSI: change scripts/setup-db.mjs first, then mirror
#  it here. `node scripts/verify-schema.mjs` diffs a live account against
#  setup-db.mjs and fails if they drift.
# ==============================================================================

Description: 'B2B/B2C hybrid tables - Organizations, Org Units, Licenses, Roles, Page Permissions. Mirrors scripts/setup-db.mjs.'

Parameters:
  OrganizationsTableName:
    Type: String
    Default: jvtutorcorner-organizations
    Description: DynamoDB table name for organization records

  OrgUnitsTableName:
    Type: String
    Default: jvtutorcorner-org-units
    Description: DynamoDB table name for the org unit hierarchy

  LicensesTableName:
    Type: String
    Default: jvtutorcorner-licenses
    Description: DynamoDB table name for license/seat management

  RolesTableName:
    Type: String
    Default: jvtutorcorner-roles
    Description: DynamoDB table name for roles

  PagePermissionsTableName:
    Type: String
    Default: jvtutorcorner-page-permissions
    Description: DynamoDB table name for page permissions

Resources:
  # ==========================================
  # Organizations (B2B accounts)
  # setup-db.mjs :: createOrganizationsTable
  # ==========================================
  OrganizationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref OrganizationsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: billingEmail
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: BillingEmailIndex
          KeySchema:
            - AttributeName: billingEmail
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: jvtutorcorner
        - Key: Purpose
          Value: B2B-Organizations

  # ==========================================
  # Org Units (hierarchy inside an organization)
  # setup-db.mjs :: createOrgUnitsTable
  # ==========================================
  OrgUnitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref OrgUnitsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: orgId
          AttributeType: S
        - AttributeName: parentId
          AttributeType: S
        - AttributeName: path
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byOrgId
          KeySchema:
            - AttributeName: orgId
              KeyType: HASH
            - AttributeName: path
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: byParentId
          KeySchema:
            - AttributeName: parentId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: jvtutorcorner
        - Key: Purpose
          Value: B2B-OrgUnits

  # ==========================================
  # Licenses (seat management)
  # setup-db.mjs :: createLicensesTable
  # ==========================================
  LicensesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref LicensesTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: orgId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byOrgId
          KeySchema:
            - AttributeName: orgId
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: byUserId
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      # TTL is intentionally NOT enabled on licenses. License.expiresAt is a
      # business-state marker read by lib/licenseService.ts; letting DynamoDB
      # delete the row on expiry would silently drop the seat record that
      # Organization.usedSeats reconciliation counts against.
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: jvtutorcorner
        - Key: Purpose
          Value: B2B-Licenses

  # ==========================================
  # Roles (RBAC)
  # PK is `id` - see lib/rolesService.ts, which does Key: { id: role.id }.
  # ==========================================
  RolesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref RolesTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: name
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: RoleNameIndex
          KeySchema:
            - AttributeName: name
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: jvtutorcorner
        - Key: Purpose
          Value: RBAC-Roles

  # ==========================================
  # Page Permissions (RBAC)
  # PK is `id`, and lib/pagePermissionsService.ts sets id === path. Each item is
  # one page carrying an embedded `permissions[]` array of per-role flags.
  #
  # KNOWN INCONSISTENCY (not fixed here - needs a data migration, not a schema
  # edit): lib/auth/pagePermissions.ts::queryDbPermission queries a RolePathIndex
  # on a top-level `roleId` attribute, but the items this table actually stores
  # have no top-level `roleId` - the role lives inside permissions[]. That query
  # therefore matches nothing and the caller silently falls back to the built-in
  # DEFAULT_PAGE_PERMISSIONS matrix. The index is declared below so the query
  # keeps returning empty rather than throwing, but either the writer must
  # denormalize one item per (roleId, path), or the reader must switch to a Get
  # on id and read permissions[]. Pick one before relying on DB overrides.
  # ==========================================
  PagePermissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref PagePermissionsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: roleId
          AttributeType: S
        - AttributeName: path
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: RolePathIndex
          KeySchema:
            - AttributeName: roleId
              KeyType: HASH
            - AttributeName: path
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: jvtutorcorner
        - Key: Purpose
          Value: RBAC-PagePermissions

Outputs:
  OrganizationsTableArn:
    Description: ARN of Organizations DynamoDB table
    Value: !GetAtt OrganizationsTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-OrganizationsTableArn'

  OrgUnitsTableArn:
    Description: ARN of Org Units DynamoDB table
    Value: !GetAtt OrgUnitsTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-OrgUnitsTableArn'

  LicensesTableArn:
    Description: ARN of Licenses DynamoDB table
    Value: !GetAtt LicensesTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LicensesTableArn'

  RolesTableArn:
    Description: ARN of Roles DynamoDB table
    Value: !GetAtt RolesTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RolesTableArn'

  PagePermissionsTableArn:
    Description: ARN of Page Permissions DynamoDB table
    Value: !GetAtt PagePermissionsTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-PagePermissionsTableArn'
