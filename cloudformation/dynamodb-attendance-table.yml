AWSTemplateFormatVersion: '2010-09-09'
Description: 'DynamoDB table for QR check-in attendance records'

Parameters:
  TableName:
    Type: String
    Default: jvtutorcorner-attendance
    Description: Name of the attendance table

Resources:
  AttendanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: courseId
          AttributeType: S
        - AttributeName: studentId
          AttributeType: S
        - AttributeName: scannedAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: OrderIdIndex
          KeySchema:
            - AttributeName: orderId
              KeyType: HASH
            - AttributeName: scannedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: CourseIdIndex
          KeySchema:
            - AttributeName: courseId
              KeyType: HASH
            - AttributeName: scannedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: StudentIdIndex
          KeySchema:
            - AttributeName: studentId
              KeyType: HASH
            - AttributeName: scannedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Application
          Value: jvtutorcorner
        - Key: Environment
          Value: production

Outputs:
  TableName:
    Description: Name of the attendance table
    Value: !Ref AttendanceTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  TableArn:
    Description: ARN of the attendance table
    Value: !GetAtt AttendanceTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TableArn'
