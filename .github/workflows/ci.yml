name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # 目前 repo 已有大量既存 lint 錯誤（多在 scripts/、tmp/、src/ 等非本次改動範圍），
        # 若設為 blocking 會讓 CI 從第一次執行就是紅的，而且擋的是舊債不是新回歸。
        # 先設為非阻斷、只留紀錄；等既存錯誤清完後再拿掉 continue-on-error。
        run: npm run lint
        continue-on-error: true

      - name: Build
        # next.config.ts 的 assertRequiredSecrets() 只要求 SESSION_SECRET / API_HMAC_SECRET
        # 兩個變數存在且不是已作廢的預設值——CI 只做建置驗證，不部署，
        # 用隨機假值即可通過檢查，不需要真正的正式環境機密。
        run: npm run build
        env:
          SESSION_SECRET: ci-build-only-dummy-session-secret-value
          API_HMAC_SECRET: ci-build-only-dummy-hmac-secret-value

      - name: Check bundled client output for leaked secrets
        run: npm run check:bundle-secrets
